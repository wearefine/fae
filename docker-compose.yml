  volumes:
    gems:
    # Shadows the ./:/app bind mount so container-installed node_modules never
    # land on the host. rollup/esbuild ship platform-native binaries, so sharing
    # node_modules between a macOS host and the linux container corrupts both.
    node_modules:
  services:
    app:
      stdin_open: true
      tty: true
      build:
        context: .
        dockerfile: ./Dockerfile.dev
      working_dir: /app/spec/dummy
      command: /bin/bash -c "bundle check || bundle install && bundle exec rails s -p 3000 -P /tmp/puma.pid -b 0.0.0.0"
      volumes:
        - gems:/gems
        - .:/app
        - node_modules:/app/spec/dummy/node_modules
      ports:
        - '3000:3000'
      depends_on:
        - db
      environment:
        - RAILS_ENV=development
        - DEV_MYSQL_HOST=db
        - FINE_NETLIFY_API_TOKEN=test
        - FINE_NETLIFY_API_USER=test
        - PRIMARY_KEY=Qw25fZjaxhxdWOKFyHjyKyYvVq9uA0Ga
        - DETERMINISTIC_KEY=FFSSjMQsRxWU4H1mH96JBW4o1HJF8wZ5
        - KEY_DERIVATION_SALT=Vgo7V3USqaODX1Vn5H9HyHJmFGo7yEOA
        - TRANSLATOR_TEXT_SUBSCRIPTION_KEY=test
        - TRANSLATOR_TEXT_REGION=test
        - OPEN_AI_API_KEY=test
        # Rails must reach the Vite dev server by service name, not localhost.
        - VITE_RUBY_HOST=vite
    vite:
      build:
        context: .
        dockerfile: ./Dockerfile.dev
      working_dir: /app/spec/dummy
      command: /bin/bash -c "npm install && npx vite --host 0.0.0.0 --port 3036"
      volumes:
        - .:/app
        - node_modules:/app/spec/dummy/node_modules
      ports:
        # Published so the browser can load modules and reach the HMR websocket.
        - '3036:3036'
      environment:
        - RAILS_ENV=development
        - VITE_RUBY_HOST=0.0.0.0
    db:
      image: mariadb
      environment:
        - MYSQL_ROOT_PASSWORD=
        - MYSQL_ALLOW_EMPTY_PASSWORD='yes'
      ports:
        - '3307:3306'
      volumes:
        - ./mysql:/var/lib/mysql
